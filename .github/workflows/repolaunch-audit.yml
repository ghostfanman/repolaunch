name: "RepoLaunch: Repository analysieren"

# Direkt auf GitHub nutzbar: Reiter "Actions" -> "RepoLaunch: Repository analysieren" -> "Run workflow".
# Der Bericht erscheint in der Zusammenfassung des Laufs, alle Dateien als Artefakt zum Download.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Öffentliches GitHub-Repository (owner/repo oder https://github.com/owner/repo)"
        required: true
        type: string
      goal:
        description: "Ziel"
        required: true
        type: choice
        default: users
        options: [users, contributors, sponsors, support_clients, saas_customers]
      language:
        description: "Berichtssprache"
        required: true
        type: choice
        default: de
        options: [de, en]
      project_type:
        description: "Projekttyp (auto = automatisch erkennen)"
        required: true
        type: choice
        default: auto
        options: [auto, cli, library, webapp, template, other]
      audience:
        description: "Zielgruppe (optional, wird als Nutzerangabe gekennzeichnet)"
        required: false
        type: string
      known_features:
        description: "Bekannte Projektmerkmale (optional, wird als Nutzerangabe gekennzeichnet)"
        required: false
        type: string
      ai_package:
        description: "KI-Launch-Paket erzeugen. Sendet Metadaten, README, ausgewählte Manifestfelder, Dateipfade, Befunde und deine Angaben an Anthropic (api.anthropic.com). Benötigt das Secret ANTHROPIC_API_KEY."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten (Lockfile)
        run: npm ci --no-audit --no-fund
      - name: Repository analysieren
        id: audit
        env:
          # Eingaben nur über Umgebungsvariablen, nie direkt im Skript (Schutz vor Einschleusung)
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_GOAL: ${{ inputs.goal }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_PROJECT_TYPE: ${{ inputs.project_type }}
          INPUT_AUDIENCE: ${{ inputs.audience }}
          INPUT_KNOWN_FEATURES: ${{ inputs.known_features }}
          INPUT_AI_PACKAGE: ${{ inputs.ai_package }}
          # Nur lesend genutzt, für höhere Ratenlimits bei öffentlichen Repositories
          GITHUB_TOKEN: ${{ github.token }}
          # Der Schlüssel wird nur übergeben, wenn das KI-Paket ausdrücklich gewählt wurde
          ANTHROPIC_API_KEY: ${{ inputs.ai_package && secrets.ANTHROPIC_API_KEY || '' }}
          OUTPUT_DIR: ${{ runner.temp }}/repolaunch-output
        run: npm run repo-audit --silent
      - name: Ergebnisdateien bereitstellen
        if: steps.audit.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.audit.outputs.artifact_name }}
          path: ${{ runner.temp }}/repolaunch-output
          retention-days: 7
          if-no-files-found: error
